<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none" stroke="#c2a05e">
  <!-- Outer Rings -->
  <circle cx="150" cy="150" r="140" stroke-width="1.2" stroke-opacity="0.35" />
  <circle cx="150" cy="150" r="132" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.35" />
  <circle cx="150" cy="150" r="100" stroke-width="1" stroke-opacity="0.25" />
  <circle cx="150" cy="150" r="48" stroke-width="1" stroke-opacity="0.3" />

  <!-- Degree Tick Marks -->
  <g stroke-width="1" stroke-opacity="0.3">
    <line x1="150" y1="10" x2="150" y2="18" />
    <line x1="150" y1="282" x2="150" y2="290" />
    <line x1="10" y1="150" x2="18" y2="150" />
    <line x1="282" y1="150" x2="290" y2="150" />
    <line x1="51" y1="51" x2="57" y2="57" />
    <line x1="243" y1="243" x2="249" y2="249" />
    <line x1="249" y1="51" x2="243" y2="57" />
    <line x1="57" y1="243" x2="51" y2="249" />
  </g>

  <!-- Cardinal Letters -->
  <text x="150" y="32" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#c2a05e" fill-opacity="0.65" text-anchor="middle" stroke="none">N</text>
  <text x="150" y="278" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#c2a05e" fill-opacity="0.65" text-anchor="middle" stroke="none">S</text>
  <text x="278" y="156" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#c2a05e" fill-opacity="0.65" text-anchor="middle" stroke="none">E</text>
  <text x="22" y="156" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#c2a05e" fill-opacity="0.65" text-anchor="middle" stroke="none">W</text>

  <!-- 4 Primary Points -->
  <!-- North Point (Filled Half Gold, Half Dark) -->
  <polygon points="150,150 150,42 140,140" fill="#c2a05e" fill-opacity="0.35" stroke="none" />
  <polygon points="150,150 150,42 160,140" fill="#c2a05e" fill-opacity="0.15" stroke="none" />
  <!-- South Point -->
  <polygon points="150,150 150,258 160,160" fill="#c2a05e" fill-opacity="0.35" stroke="none" />
  <polygon points="150,150 150,258 140,160" fill="#c2a05e" fill-opacity="0.15" stroke="none" />
  <!-- East Point -->
  <polygon points="150,150 258,150 160,140" fill="#c2a05e" fill-opacity="0.35" stroke="none" />
  <polygon points="150,150 258,150 160,160" fill="#c2a05e" fill-opacity="0.15" stroke="none" />
  <!-- West Point -->
  <polygon points="150,150 42,150 140,160" fill="#c2a05e" fill-opacity="0.35" stroke="none" />
  <polygon points="150,150 42,150 140,140" fill="#c2a05e" fill-opacity="0.15" stroke="none" />

  <!-- 4 Corner Points -->
  <!-- NE -->
  <polygon points="150,150 226,74 158,142" fill="#c2a05e" fill-opacity="0.25" stroke="none" />
  <polygon points="150,150 226,74 142,158" fill="#c2a05e" fill-opacity="0.1" stroke="none" />
  <!-- NW -->
  <polygon points="150,150 74,74 142,142" fill="#c2a05e" fill-opacity="0.25" stroke="none" />
  <polygon points="150,150 74,74 158,158" fill="#c2a05e" fill-opacity="0.1" stroke="none" />
  <!-- SE -->
  <polygon points="150,150 226,226 158,158" fill="#c2a05e" fill-opacity="0.25" stroke="none" />
  <polygon points="150,150 226,226 142,142" fill="#c2a05e" fill-opacity="0.1" stroke="none" />
  <!-- SW -->
  <polygon points="150,150 74,226 142,158" fill="#c2a05e" fill-opacity="0.25" stroke="none" />
  <polygon points="150,150 74,226 158,142" fill="#c2a05e" fill-opacity="0.1" stroke="none" />

  <!-- Center Pivot -->
  <circle cx="150" cy="150" r="10" fill="#c2a05e" fill-opacity="0.45" stroke="#c2a05e" stroke-width="1.5" />
  <circle cx="150" cy="150" r="3" fill="#ffffff" stroke="none" />
</svg>
